                    c.kode.toLowerCase().includes(searchQuery) || 
                    c.dosen.toLowerCase().includes(searchQuery);
                return matchSemester && matchSearch;
            });

                        <div class="shrink-0 mt-1">
                            ${isSelected 
                                ? `<span class="bg-slate-200 text-slate-500 p-2 rounded-lg text-sm flex items-center justify-center w-8 h-8"><i class="fas fa-check"></i></span>`
                                : `<button class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg text-sm flex items-center justify-center w-8 h-8 transition shadow-sm hover:scale-105 active:scale-95" title="Pilih Jadwal"><i class="fas fa-plus"></i></button>`
                            }
                        </div>
                    </div>
                `;

                if (!isSelected) {
                    card.addEventListener('click', () => addCourse(course));
                }
                
                container.appendChild(card);
            });
        }

        // --- STREAMING_CHUNK:Logika Bentrok Jadwal Akurat ---
        
        // Ubah jam "08:30" menjadi hitungan menit absolut (misal: 8*60 + 30 = 510)
        function timeToMinutes(timeStr) {
            if(!timeStr) return 0;
            const parts = timeStr.trim().replace('.', ':').split(':');
            if(parts.length < 2) return 0;
            return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        }

        function addCourse(newCourse) {
            // 1. Kalkulasi Menit untuk deteksi akurat
            const newStartMins = timeToMinutes(newCourse.mulai);
            const newEndMins = timeToMinutes(newCourse.selesai);
            
            if (newStartMins === 0 || newEndMins === 0) {
                showToast(`Format waktu ${newCourse.nama} tidak valid.`, 'error');
                return;
            }

            // 2. Cek Batas SKS
            const total = selectedCourses.reduce((sum, c) => sum + parseInt(c.sks || 0), 0);
            if (total + parseInt(newCourse.sks || 0) > MAX_SKS) {
                showToast(`<b>Gagal!</b> Maksimal ${MAX_SKS} SKS tercapai.`, 'error');
                return;
            }

            // 3. Cek Bentrok (Murni berbasis waktu overlap)
            const conflict = selectedCourses.find(c => {
                if (c.hari !== newCourse.hari) return false;
                
                const existingStartMins = timeToMinutes(c.mulai);
                const existingEndMins = timeToMinutes(c.selesai);
                
                // Rumus Overlap: Start A < End B AND Start B < End A
                return (newStartMins < existingEndMins) && (existingStartMins < newEndMins);
            });

            if (conflict) {
                showToast(`<b>Bentrok Jadwal!</b><br>${newCourse.nama} beririsan waktu dengan <b>${conflict.nama}</b> pada hari ${conflict.hari}.`, 'error');
                return;
            }

            // Simpan data menit untuk kemudahan sorting saat dirender
            const courseToAdd = {...newCourse, _startMins: newStartMins};
            selectedCourses.push(courseToAdd);
            
            updateUI();
            showToast(`${newCourse.nama} ditambahkan.`, 'success');
        }

        function removeCourse(id) {
            selectedCourses = selectedCourses.filter(c => c.id !== id);
            updateUI();
        }

        function updateUI() {
            // Update Text SKS
            const total = selectedCourses.reduce((sum, c) => sum + parseInt(c.sks || 0), 0);
            document.getElementById('total-sks').textContent = total;
            document.getElementById('export-total-sks').textContent = total;
            
            // Toggle Tombol Export & Judul Tabel
            const btnExport = document.getElementById('btn-export');
            const titleJadwal = document.getElementById('title-jadwal');
            
            if (selectedCourses.length > 0) {
                btnExport.disabled = false;
                btnExport.classList.remove('opacity-50', 'cursor-not-allowed');
                titleJadwal.classList.remove('hidden');
            } else {
                btnExport.disabled = true;
                btnExport.classList.add('opacity-50', 'cursor-not-allowed');
                titleJadwal.classList.add('hidden');
            }

            renderCourseList();
            renderSelectedCourses();
        }

        // --- STREAMING_CHUNK:Render Tabel Jadwal (Kanan) ---
        function renderSelectedCourses() {
            const container = document.getElementById('selected-courses-container');
            container.innerHTML = '';

            if (selectedCourses.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-8 text-slate-400 text-sm flex flex-col items-center justify-center h-[50vh] min-h-[300px]">
                        <div class="bg-white p-6 rounded-full shadow-sm border border-slate-100 mb-4">
                            <i class="fas fa-calendar-times text-5xl text-blue-100"></i>
                        </div>
                        <p class="font-medium text-slate-500 text-base">Jadwal masih kosong</p>
                        <p class="text-xs mt-2 text-slate-400">Pilih mata kuliah dari panel di sebelah kiri.</p>
                    </div>`;
                return;
            }

            // Kelompokkan per hari
            const grouped = {};
            days.forEach(day => grouped[day] = []);
            
            selectedCourses.forEach(c => {
                if (grouped[c.hari]) grouped[c.hari].push(c);
            });

            // Struktur Tabel Kolom Hari (Tanpa Jam di Kiri)
            let html = `
                <div class="w-full overflow-x-auto custom-scroll pb-2">
                    <div class="min-w-[800px] pb-4"> 
                        <!-- Header Baris Hari -->
                        <div class="grid grid-cols-5 gap-4 border-b-2 border-slate-200 pb-3 mb-4">
            `;
            
            // Render Label Hari
            days.forEach(day => {
                const count = grouped[day].length;
                const badge = count > 0 ? `<span class="bg-blue-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1">${count}</span>` : '';
                html += `<div class="font-bold text-center text-slate-700 bg-white py-3 rounded-xl text-sm uppercase tracking-wider shadow-sm border border-slate-200">${day} ${badge}</div>`;
            });
            
            html += `</div><!-- Baris Isi Kartu --><div class="grid grid-cols-5 gap-4">`;

            // Render Kartu per hari
            days.forEach((day, colIdx) => {
                // Background kolom hari
                html += `<div class="flex flex-col gap-3 min-h-[250px] bg-slate-100/50 p-2.5 rounded-xl border border-slate-200/60">`;
                
                // Urutkan jadwal di hari ini berdasarkan waktu mulai (menit absolut)
                grouped[day].sort((a, b) => a._startMins - b._startMins);
                
                grouped[day].forEach((course, i) => {
                    const colorClasses = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-pink-500', 'bg-indigo-500'];
                    const colorClass = colorClasses[(colIdx + i) % colorClasses.length];
                    
                    html += `
                        <div class="p-3 rounded-xl border border-slate-200 bg-white shadow-sm relative overflow-hidden group hover:shadow-md transition-all">
                            <!-- Pita Warna Kiri -->
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 ${colorClass}"></div>
                            
                            <div class="pl-2">
                                <div class="flex justify-between items-start mb-2 gap-1">
                                    <h4 class="font-bold text-slate-800 text-xs leading-snug pr-2">${course.nama}</h4>
                                    <button onclick="removeCourse('${course.id}')" class="delete-btn flex-shrink-0 text-slate-400 hover:text-red-500 hover:bg-red-50 w-6 h-6 rounded-md transition-colors flex items-center justify-center opacity-100 lg:opacity-0 group-hover:opacity-100 -mt-1 -mr-1" title="Hapus">
                                        <i class="fas fa-times text-xs"></i>
                                    </button>
                                </div>
                                
                                <div class="flex flex-wrap gap-1 mb-2">
                                    <span class="text-[10px] font-bold text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">
                                        ${course.kode} • Kls ${course.kelas}
                                    </span>
                                </div>

                                <div class="text-[10px] text-slate-500 space-y-1.5">
                                    <div class="flex items-center gap-1.5 font-semibold text-blue-700 bg-blue-50 p-1 rounded-md border border-blue-100 w-fit">
                                        <i class="fas fa-clock text-blue-400"></i> ${course.mulai} - ${course.selesai}
                                    </div>
                                    <div class="flex items-start gap-1.5 pt-1">
                                        <i class="fas fa-map-marker-alt text-red-400 mt-0.5 w-3 text-center"></i>
                                        <span class="line-clamp-1 font-medium">${course.ruang}</span>
                                    </div>
                                    <div class="flex items-start gap-1.5">
                                        <i class="fas fa-user-tie text-slate-400 mt-0.5 w-3 text-center"></i>
                                        <span class="line-clamp-2 leading-tight">${course.dosen}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                if(grouped[day].length === 0) {
                    html += `<div class="h-full flex items-center justify-center opacity-40"><span class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">- Kosong -</span></div>`;
                }

                html += `</div>`;
            });

            html += `</div></div></div>`;
            container.innerHTML = html;
        }

        // --- STREAMING_CHUNK:Export JPG (html2canvas) ---
        async function exportJadwal() {
            if (selectedCourses.length === 0) return;
            
            showLoader("Menyimpan Gambar...");
            
            const captureArea = document.getElementById('capture-area');
            const header = document.getElementById('export-header');
            const footer = document.getElementById('export-footer');
            const jadwalTitle = document.getElementById('title-jadwal');
            
            // Persiapan DOM
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('export-time').textContent = `Dicetak pada: ${dateStr}`;

            header.classList.remove('hidden');
            footer.classList.remove('hidden');
            jadwalTitle.classList.add('hidden'); // Sembunyikan judul asli saat print
            
            // Sembunyikan tombol delete
            document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'none');
            
            // Styling khusus canvas agar rapi
            const origClasses = captureArea.className;
            captureArea.className = "w-full flex flex-col bg-white overflow-visible rounded-none border-none shadow-none";

            try {
                // Tunggu render DOM
                await new Promise(r => setTimeout(r, 400));

                const canvas = await html2canvas(captureArea, {
                    scale: 2, 
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    windowWidth: 1200 // Paksa lebar virtual agar tabel tidak terpotong
                });

                const link = document.createElement('a');
                link.download = `KRS_Jadwal_${new Date().getTime()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();

                showToast('Berhasil disimpan sebagai JPG!', 'success');

            } catch (err) {
                console.error(err);
                showToast('Gagal memproses gambar.', 'error');
            } finally {
                // Kembalikan DOM
                header.classList.add('hidden');
                footer.classList.add('hidden');
                jadwalTitle.classList.remove('hidden');
                captureArea.className = origClasses;
                document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = '');
                hideLoader();
            }
        }

        // --- STREAMING_CHUNK:Utilities ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const config = {
                success: { color: 'bg-emerald-50 text-emerald-800 border-emerald-400', icon: 'fa-check-circle text-emerald-500' },
                error: { color: 'bg-red-50 text-red-800 border-red-400', icon: 'fa-exclamation-circle text-red-500' },
                info: { color: 'bg-blue-50 text-blue-800 border-blue-400', icon: 'fa-info-circle text-blue-500' }
            };

            toast.className = `flex items-start gap-3 p-4 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border ${config[type].color} transition-all duration-300 transform translate-x-full opacity-0 pointer-events-auto max-w-sm`;
            toast.innerHTML = `<i class="fas ${config[type].icon} text-xl mt-0.5"></i> <div class="text-sm font-medium leading-relaxed">${message}</div>`;
            
            container.appendChild(toast);
            
            // Animasi Masuk
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            });

            // Animasi Keluar
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function showLoader(msg) {
            document.getElementById('loader-text').textContent = msg;
            document.getElementById('loader').style.display = 'flex';
        }
        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }
    </script>
</body>
